name: Conduit Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      release_tag:
        type: string
        default: ''
    secrets:
      CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Conduit-Club/SHOU-Launcher'
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.publish.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish club launcher
        id: publish
        shell: pwsh
        env:
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG) {
            ./scripts/conduit/Publish.ps1 -Configuration Release -ReleaseTag $env:RELEASE_TAG
          } else {
            ./scripts/conduit/Publish.ps1
          }
      - name: WPF settings runtime regression
        shell: pwsh
        run: dotnet test PCL.Launcher.Test/PCL.Launcher.Test.csproj -c Beta -p:Platform=x64 --blame-hang-timeout 2m --logger 'trx;LogFileName=launcher-ui.trx' --results-directory artifacts/test-results
      - name: Java trust repair and keytool regression
        shell: pwsh
        run: |
          $javaTestHome = if ($env:JAVA_HOME_17_X64) { $env:JAVA_HOME_17_X64 } else { $env:JAVA_HOME }
          if (-not $javaTestHome -or -not (Test-Path -LiteralPath (Join-Path $javaTestHome 'bin/keytool.exe'))) {
            throw 'A preinstalled JDK with keytool is required for the Java trust repair gate.'
          }
          dotnet test PCL.Core.Test/PCL.Core.Test.csproj -c Beta -p:Platform=x64 --filter 'FullyQualifiedName~JavaTrustRepairTest' --blame-hang-timeout 2m --logger 'trx;LogFileName=java-trust.trx' --results-directory artifacts/test-results
      - name: Club regression tests
        shell: pwsh
        run: dotnet test PCL.Core.Test/PCL.Core.Test.csproj -c Beta -p:Platform=x64 --filter '(FullyQualifiedName~Conduit|FullyQualifiedName~ProfileManagement|FullyQualifiedName~SemVer|FullyQualifiedName~Minecraft.Authentication)&TestCategory!=Integration' --logger 'trx;LogFileName=club.trx' --results-directory artifacts/test-results
      - name: Core tests (offline; integrations separate)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: dotnet test PCL.Core.Test/PCL.Core.Test.csproj -c Beta -p:Platform=x64 --filter 'TestCategory!=Integration' --blame-hang-timeout 2m --logger 'trx;LogFileName=full.trx' --results-directory artifacts/test-results
      - name: Upload verified club package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.publish.outputs.artifact_name }}
          path: |
            artifacts/conduit/*.zip
            artifacts/conduit/*.sha256
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
