name: Conduit Build

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Conduit-Club/PCL-CE-SHOU'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish club launcher
        shell: pwsh
        env:
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: ./scripts/conduit/Publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: PCL-CE-SHOU-win-x64
          path: |
            artifacts/conduit/*.zip
            artifacts/conduit/*.sha256
          if-no-files-found: error
      - name: Club regression tests
        shell: pwsh
        run: dotnet test PCL.Core.Test/PCL.Core.Test.csproj -c Beta -p:Platform=x64 --filter 'FullyQualifiedName~Conduit|FullyQualifiedName~ProfileManagement|FullyQualifiedName~SemVer|FullyQualifiedName~Minecraft.Authentication' --logger 'trx;LogFileName=club.trx' --results-directory artifacts/test-results
      - name: Core tests (offline; integrations separate)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: dotnet test PCL.Core.Test/PCL.Core.Test.csproj -c Beta -p:Platform=x64 --filter 'TestCategory!=Integration' --blame-hang-timeout 2m --logger 'trx;LogFileName=full.trx' --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
