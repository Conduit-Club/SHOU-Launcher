name: Conduit Desktop Release Draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag; v1.6 is a prerelease of source 1.6.0'
        required: true
        type: string
      prerelease:
        description: 'Prerelease outside main (stable releases still require main)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'Conduit-Club/SHOU-Launcher'
    runs-on: windows-2025
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
      codename: ${{ steps.identity.outputs.codename }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate tag, source and release mode
        id: identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REQUEST_PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
        run: |
          $pre=$env:REQUEST_PRERELEASE -eq 'true' -or $env:RELEASE_TAG -cmatch '^v\d+\.\d+$' -or $env:RELEASE_TAG -cmatch '^v\d+\.\d+\.\d+-'
          $identity=./scripts/conduit/Get-BuildIdentity.ps1 -Configuration Release -ReleaseTag $env:RELEASE_TAG -Prerelease:$pre
          "tag=$($identity.ReleaseTag)" >> $env:GITHUB_OUTPUT
          "source_sha=$($identity.Commit)" >> $env:GITHUB_OUTPUT
          "version=$($identity.Version)" >> $env:GITHUB_OUTPUT
          "codename=$($identity.Codename)" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
  build:
    needs: validate
    uses: ./.github/workflows/cross-platform-desktop.yml
    with:
      source_ref: ${{ needs.validate.outputs.tag }}
      release_tag: ${{ needs.validate.outputs.tag }}
      prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
    secrets: inherit
  draft:
    needs: [validate, build]
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: Desktop-Release-*-${{ github.run_id }}
          path: candidates
      - name: Validate and collect all three Desktop packages
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SOURCE: ${{ needs.validate.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_CODENAME: ${{ needs.validate.outputs.codename }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          ./scripts/conduit/Collect-ReleaseAssets.ps1 -InputRoot candidates -OutputRoot release-assets -Tag $env:RELEASE_TAG -SourceSha $env:RELEASE_SOURCE -Version $env:RELEASE_VERSION -Codename $env:RELEASE_CODENAME -Prerelease:($env:RELEASE_PRERELEASE -eq 'true')
      - name: Create reviewable Desktop release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_CODENAME: ${{ needs.validate.outputs.codename }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          $flags=@('--verify-tag','--draft','--latest=false')
          if($env:RELEASE_PRERELEASE -eq 'true'){$flags+='--prerelease'}
          $notes="docs/conduit/RELEASE-v$($env:RELEASE_VERSION).md"
          if(-not (Test-Path -LiteralPath $notes -PathType Leaf)){throw 'Version-specific release notes are required.'}
          gh release create $env:RELEASE_TAG @flags --title "SHOU-Launcher v$($env:RELEASE_VERSION) · $($env:RELEASE_CODENAME)" --notes-file $notes
          if($LASTEXITCODE -ne 0){throw 'Cannot create draft; existing tags/releases are never overwritten.'}
          $files=Get-ChildItem release-assets -File | ForEach-Object FullName
          gh release upload $env:RELEASE_TAG @files
          if($LASTEXITCODE -ne 0){throw 'Release asset upload failed; draft stays unpublished.'}
