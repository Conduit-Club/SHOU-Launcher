name: Shared Desktop migration

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional same-repository source ref'
        type: string
        default: ''
      release_tag:
        description: 'Existing source tag; empty for a development candidate'
        type: string
        default: ''
      prerelease:
        description: 'Allow a matching prerelease tag outside main'
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      release_tag:
        type: string
        default: ''
      prerelease:
        type: boolean
        default: false
    secrets:
      CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      MACOS_SIGNING_CERTIFICATE_BASE64:
        required: false
      MACOS_SIGNING_PASSWORD:
        required: false
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, features/macos-arm64, features/windows-parity]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
            publish: true
          - runner: windows-2025
            rid: win-x64
            publish: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          overwrite-settings: false
          settings-path: ${{ runner.temp }}/shou-java-settings
      - name: Register isolated runner paths and tools
        shell: pwsh
        run: ./scripts/dev/Initialize-CI.ps1 -TaskRoot (Join-Path $env:RUNNER_TEMP 'shou-desktop-dev')
      - name: Verify parser contract
        shell: pwsh
        run: ./scripts/conduit/Test-BuildEnvironment.ps1
      - name: Verify release tag policy and asset selection
        shell: pwsh
        run: |
          $tools=Get-Content -Raw (Join-Path $env:SHOU_DEV_ROOT 'control/tools.json') | ConvertFrom-Json
          & $tools.python.executable scripts/conduit/test_release_pipeline.py --directory "$env:SHOU_DEV_ROOT/reports/release-pipeline"
          if($LASTEXITCODE -ne 0){throw 'Release pipeline regression failed.'}
      - name: Portable Core and protocol tests
        shell: pwsh
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: |
          $filter='TestCategory!=NativeCredential&TestCategory!=OnlineJava&TestCategory!=JavaTrustInterop'
          if(-not $IsMacOS){$filter+='&TestCategory!=MacOSNativeArgv'}
          if($IsWindows){$filter+='&TestCategory!=JavaTrustPosixLinks'}
          ./scripts/dev/Invoke-Dev.ps1 -RunId core -Action Test -EntryProject tests/SHOU.Launcher.Core.Tests/SHOU.Launcher.Core.Tests.csproj -RuntimeIdentifier $env:TARGET_RID -Configuration Release -TestFilter $filter
      - name: Shared Avalonia Headless tests
        shell: pwsh
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: ./scripts/dev/Invoke-Dev.ps1 -RunId headless -Action Test -EntryProject tests/SHOU.Launcher.Desktop.Tests/SHOU.Launcher.Desktop.Tests.csproj -RuntimeIdentifier $env:TARGET_RID -Configuration Release
      - name: Import fixed Mac candidate signing identity
        if: matrix.rid == 'osx-arm64' && github.event_name != 'pull_request'
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: python3 scripts/macos/manage_signing.py install-ci --directory "$RUNNER_TEMP/shou-macos-signing"
      - name: Verify Mac signing continuity and Keychain access
        if: matrix.rid == 'osx-arm64' && github.event_name != 'pull_request'
        run: python3 scripts/macos/test_signing.py --directory "$SHOU_DEV_ROOT/reports/signing-continuity"
      - name: Verify stable Mac credential broker and caller isolation
        if: matrix.rid == 'osx-arm64' && github.event_name != 'pull_request'
        run: python3 scripts/macos/test_credential_broker.py --directory "$SHOU_DEV_ROOT/reports/credential-broker"
      - name: Publish same Desktop candidate
        if: matrix.publish
        shell: pwsh
        env:
          TARGET_RID: ${{ matrix.rid }}
          PCL_MS_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.CLIENT_ID || '' }}
          PCL_CURSEFORGE_API_KEY: ${{ github.event_name != 'pull_request' && secrets.CURSEFORGE_API_KEY || '' }}
          SHOU_MACOS_ALLOW_ADHOC: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
        run: |
          $release=@{}
          if($env:RELEASE_TAG){$release.ReleaseTag=$env:RELEASE_TAG}
          if($env:RELEASE_PRERELEASE -eq 'true'){$release.Prerelease=$true}
          ./scripts/dev/Invoke-Dev.ps1 -RunId candidate -Action Publish -RuntimeIdentifier $env:TARGET_RID -Configuration Release @release
      - name: Verify real Mac candidate upgrade and credential fault handling
        if: matrix.rid == 'osx-arm64' && github.event_name != 'pull_request'
        run: python3 scripts/macos/test_packaged_credentials.py --app "$SHOU_DEV_ROOT/dist/candidate/Desktop/Release/osx-arm64/default/SHOU Launcher.app" --directory "$SHOU_DEV_ROOT/reports/packaged-credential-upgrade"
      - name: Preserve Windows ARM64 build
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          PCL_MS_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.CLIENT_ID || '' }}
          PCL_CURSEFORGE_API_KEY: ${{ github.event_name != 'pull_request' && secrets.CURSEFORGE_API_KEY || '' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
        run: |
          $release=@{}
          if($env:RELEASE_TAG){$release.ReleaseTag=$env:RELEASE_TAG}
          if($env:RELEASE_PRERELEASE -eq 'true'){$release.Prerelease=$true}
          ./scripts/dev/Invoke-Dev.ps1 -RunId candidate-arm64 -Action Publish -RuntimeIdentifier win-arm64 -Configuration Release @release
      - name: Remove ephemeral Mac signing identity
        if: always() && matrix.rid == 'osx-arm64' && github.event_name != 'pull_request'
        run: python3 scripts/macos/manage_signing.py cleanup-ci --directory "$RUNNER_TEMP/shou-macos-signing"
      - name: Upload candidate and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Desktop-Release-${{ matrix.rid }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/shou-desktop-dev/dist/**/*.zip
            ${{ runner.temp }}/shou-desktop-dev/dist/**/*.sha256
            ${{ runner.temp }}/shou-desktop-dev/dist/**/BUILD-INFO.json
            ${{ runner.temp }}/shou-desktop-dev/dist/**/SIGNING-INFO.json
            ${{ runner.temp }}/shou-desktop-dev/dist/**/CREDENTIAL-BROKER-INFO.json
            ${{ runner.temp }}/shou-desktop-dev/build/**/reports/**
            ${{ runner.temp }}/shou-desktop-dev/reports/**
          if-no-files-found: warn
