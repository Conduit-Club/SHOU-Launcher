name: Build (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
    inputs:
      configuration:
        required: true
        type: string
      architecture:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'

      - name: Build Project
        id: publish
        shell: pwsh
        env:
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
          BUILD_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          ./scripts/conduit/Publish.ps1 -Architecture $env:BUILD_ARCHITECTURE -Configuration $env:BUILD_CONFIGURATION -OutputRoot artifact

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.publish.outputs.artifact_name }}
          path: artifact/**
